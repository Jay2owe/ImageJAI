[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagejai-console"
version = "0.5.0"
description = "Standalone terminal console for the ImageJAI Fiji plugin"
readme = "docs/console/README.md"
requires-python = ">=3.10"
dependencies = [
  "textual>=6.2,<7",
  "PyYAML>=6.0",
  "litellm==1.83.14",
  "openai==2.24.0",
  "anthropic==0.97.0",
  "google-genai==1.71.0",
  "pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
proxy = ["litellm[proxy]==1.83.14"]
test = ["pytest>=8", "respx==0.23.1", "pytest-httpx==0.36.2"]

[project.scripts]
imagejai = "agent.console.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
exclude = ["agent.console.tests*"]
namespaces = false

[tool.setuptools.package-data]
"agent.console" = ["*.yaml"]
"agent.skills" = ["**/*.md"]
"agent.recipes" = ["*.yaml", "*.json", "scripts/*.py"]
"agent.providers" = ["*.yaml", "*.json", "*.md", "requirements.txt"]
"agent.contexts" = ["**/*.md", "**/*.yaml", "**/*.json"]
"agent.gemma4_31b" = ["*.json", "*.md"]
