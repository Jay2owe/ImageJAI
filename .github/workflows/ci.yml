name: CI

on:
  push:
    branches:
      - main
      - public-main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp clean test -Denforcer.skip=true

      - name: Build plugin jar
        run: mvn -B -ntp clean -DskipTests -Denforcer.skip=true package

      - name: Upload plugin jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagej-ai-plugin-jar
          path: |
            target/imagej-ai-*.jar
            !target/*-sources.jar
            !target/*-tests.jar
            !target/original-*.jar
          if-no-files-found: error
