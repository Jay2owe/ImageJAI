[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imagej-use-auto"
version = "0.1.0"
description = "Persistent authenticated stdin runner for ImageJAI"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
imagej-use-auto = "imagej_use.run:main"

[tool.setuptools]
packages = ["imagej_use"]
py-modules = ["ij"]
